[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 79

[tool.black]
line-length = 79

[tool.docc.plugins."docc.python.discover"]
paths = [ "src" ]
strip_path_to_package = true

[tool.docc.output]
path = "docs"
